server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic gzip for text/JS/CSS.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml
        application/manifest+json;
    gzip_min_length 256;

    # Product images are returned by the API as relative paths
    # (/uploads/products/<uuid>.png, no origin) and used as-is in <img src>
    # across several components (AppImageUpload.vue, ProductCard.vue,
    # CartLineItem.vue, SaleCatalogPicker.vue). Under separate subdomains
    # (app.albertogdlc.org vs api.albertogdlc.org) that relative path would
    # resolve against the frontend's own origin and 404 — so this proxy
    # forwards it to the backend, mirroring the Vite dev-server proxy that
    # rewrites /uploads to http://localhost:3000 in development.
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
    }

    # index.html, the service worker, and the web app manifest must always
    # be revalidated so the browser notices a new deploy (VitePWA is
    # configured with registerType: 'prompt' + skipWaiting: false, which
    # only works if the SW file itself is never served stale from cache).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed, content-addressed build output (/assets/*.js, *.css,
    # etc.) can be cached aggressively and immutably: the filename changes
    # whenever the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: vue-router uses createWebHistory, so any unmatched path
    # must resolve to index.html and let the client-side router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
