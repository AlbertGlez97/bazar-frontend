name: CI/CD bazar-frontend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vue-tsc -b
      - name: Tests con cobertura (umbral 80%)
        run: npm run test:coverage

  sonar:
    needs: test
    runs-on: host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube analysis
        uses: https://github.com/SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Quality Gate
        uses: https://github.com/SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy:
    needs: sonar
    runs-on: host
    steps:
      - name: Deploy al LXC 108
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -eu
          umask 077
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$WORK/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$WORK/known_hosts"
          ssh -i "$WORK/key" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$WORK/known_hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /srv/marchanta/bazar-frontend && git pull --ff-only forgejo main \
             && cd /srv/marchanta && VITE_API_URL='$VITE_API_URL' docker compose -f docker-compose.prod.yml up -d --build frontend"
